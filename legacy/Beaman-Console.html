<style>

<script>

// ---------- helpers ----------

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");

const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

const monday = d => addDays(d, -((d.getDay() + 6) % 7));

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const weekLabel = ws => { const a = parse(ws), b = addDays(a, 6); return `${MON[a.getMonth()]} ${a.getDate()} – ${a.getMonth()===b.getMonth() ? "" : MON[b.getMonth()]+" "}${b.getDate()}, ${b.getFullYear()}`; };
const fh = n => { n = Math.round((+n || 0) * 100) / 100; return n.toFixed(2).replace(/\.?0+$/, "") || "0"; };

const usd = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", maximumFractionDigits:0});

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";

const odo = n => n == null || n === "" ? "—" : (+n).toLocaleString("en-US", {maximumFractionDigits: 1});

const fm2 = n => "$" + (+n || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const frate = n => "$" + (+n || 0).toFixed(3).replace(/0$/, "");
const parseHours = v => {
  v = String(v).trim(); if (!v) return 0;
  const m = v.match(/^(\d+):(\d{1,2})$/); if (m) return +m[1] + +m[2] / 60;
  const n = Number(v); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
};
let toastT;
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); };
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

// ---------- state ----------
const S = {
  view: "timesheet", tasks: {}, projects: {}, resources: {}, sheets: {}, trips: {}, vehicles: {}, rates: {}, contacts: {}, accounts: {}, opps: {}, employees: {}, invoices: {}, ledger: {}, settings: {},
  got: {tasks:false, projects:false, resources:false, sheets:false, trips:false, vehicles:false, rates:false, contacts:false, accounts:false, opps:false, employees:false, invoices:false, ledger:false, settings:false},
  inv: {sel: null, status: "", acct: "", gen: null}, acct: {range: "ytd", basis: "cash", from: "", to: "", txEdit: null, txKind: "", payRes: null},
  pipe: {q: "", rep: "", sel: null, isNew: false, seed: null, convert: false},
  acc: {q: "", type: "", sort: "name", sel: null, editing: false, isNew: false},
  con: {q: "", show: "all", source: "", sort: "name", sel: null, editing: false, isNew: false},
  mil: {range: "ytd", vehicle: "", kind: "", from: "", to: ""}, tripEdit: null,
  db: null, user: null, uid: null, canEdit: false, canWrite: true,
  resource: store.get("bt.resource") || "", week: iso(monday(new Date())),
  draft: null, dirty: false, saving: false, saveT: null, confirm: null,
  showAllAppr: false, rep: {range: "month", group: "client", from: "", to: ""}, editing: null
};
const VIEWS = ["timesheet","approvals","budgets","mileage","pipeline","accounts","contacts","invoices","accounting","reports","employees","setup"];
const hv = location.hash.slice(1); if (VIEWS.includes(hv)) S.view = hv;

const taskList = () => Object.values(S.tasks).sort((a,b) => a.taskId - b.taskId);
const resList = () => Object.values(S.resources).sort((a,b) => a.name.localeCompare(b.name));
const projName = t => (S.projects[t.projectId] && S.projects[t.projectId].name) || t.project || t.projectId || "—";
const sheetId = (rid, ws) => `${rid}_${ws}`;
const billable = t => (+t.billRate || 0) > 0;

// ---------- data ----------
function onData() {
  const ready = Object.values(S.got).every(Boolean);
  if (!ready) return;
  $("#sync").textContent = "Saved in this browser";
  if (!S.resource || !S.resources[S.resource]) S.resource = (resList()[0] || {}).id || "";
  updateBadge();
  const busy = document.activeElement && document.activeElement.closest && document.activeElement.closest("#main input, #main select");
  if (S.view === "timesheet") { if (!S.dirty && !S.saving) loadDraft(); if (!busy) render(); }
  else if (S.view === "pipeline" && $("#board")) { $("#board").outerHTML = boardHtml(); $("#pipeStats").innerHTML = pipeStatsHtml(); const ae = document.activeElement; if (!(ae && ae.closest && ae.closest("#drawer"))) renderDrawer(); }
  else if (S.view === "accounts" && $("#alist")) { if (!S.acc.editing) { if (!busy || document.activeElement.id === "accQ") refreshAcc(); const ae = document.activeElement; if (!(ae && ae.closest && ae.closest("#adetail input, #adetail select"))) $("#adetail").innerHTML = accDetailHtml(); } }
  else if (S.view === "contacts" && $("#clist")) { if (!S.con.editing) { if (!busy || document.activeElement.id === "conQ") refreshList(); const ae = document.activeElement; if (!(ae && ae.closest && ae.closest("#cdetail input, #cdetail select"))) $("#cdetail").innerHTML = detailHtml(); } }
  else if (!busy) render();
}
// state key "sheets" is stored in the "timesheets" collection
function listen(name) {
  const col = name === "sheets" ? "timesheets" : name === "opps" ? "opportunities" : name;
  S.db.collection(col).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = {id: d.id, ...d.data()}; });
    S[name] = m; S.got[name] = true; onData();
  }, e => { $("#sync").textContent = "Live updates stopped: reload to reconnect"; console.warn(col, e); S.got[name] = true; onData(); });
}
async function boot() {
  const loadTimer = setTimeout(() => {
    if (!Object.values(S.got).every(Boolean)) $("#sync").textContent = "Can't reach saved data yet — still trying";
  }, 10000);
  const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { clearTimeout(loadTimer); $("#main").innerHTML = `<div class="panel empty"><h2>Saved timesheets aren't available in this view</h2><p class="note" style="margin:8px auto 0">Open this page signed in to claude.ai to enter and review time. Timesheets, tasks and rates are kept in the page's shared ledger.</p></div>`; $("#sync").textContent = "Offline"; return; }
  S.db = db;
  const user = await window.claude.use("user").catch(() => null);
  S.user = user;
  if (user) {
    S.uid = await user.id().catch(() => null);
    S.canEdit = await user.canEdit().catch(() => false);
    const w = await user.can("data.write").catch(() => null); S.canWrite = w !== false;
  }
  ["tasks","projects","resources","sheets","trips","vehicles","rates","contacts","accounts","opps","employees","invoices","ledger","settings"].forEach(listen);
  const iv = setInterval(() => { if (Object.values(S.got).every(Boolean)) { clearTimeout(loadTimer); clearInterval(iv); } }, 300);
}

// ---------- timesheet draft ----------
function loadDraft() {
  const id = sheetId(S.resource, S.week), src = S.sheets[id];
  S.draft = src ? JSON.parse(JSON.stringify(src)) : {id, resourceId: S.resource, resource: (S.resources[S.resource]||{}).name || "", weekStart: S.week, status: "draft", rows: []};
  S.draft.rows = (S.draft.rows || []).map(r => ({taskId: r.taskId, h: (r.h || []).concat([0,0,0,0,0,0,0]).slice(0,7).map(Number), note: r.note || ""}));
  S.dirty = false;
}
const locked = () => !S.draft || S.draft.status === "submitted" || S.draft.status === "approved" || !S.canWrite;
function queueSave(now) {
  S.dirty = true; $("#sync").textContent = "Unsaved changes…";
  clearTimeout(S.saveT); S.saveT = setTimeout(saveDraft, now ? 0 : 700);
}
async function saveDraft(extra) {
  clearTimeout(S.saveT);
  if (!S.draft) return;
  if (S.saving) { S.saveT = setTimeout(() => saveDraft(extra), 250); return; }
  const d = S.draft; Object.assign(d, extra || {});
  const body = {resourceId: d.resourceId, resource: d.resource, weekStart: d.weekStart, status: d.status,
    rows: d.rows.map(r => ({taskId: r.taskId, h: r.h, note: r.note || ""})), updatedAt: new Date().toISOString(), updatedBy: S.uid || null};
  ["submittedAt","approvedAt","approvedBy","returnNote"].forEach(k => { if (d[k] != null) body[k] = d[k]; });
  S.saving = true; $("#sync").textContent = "Saving…";
  try { await S.db.doc("timesheets/" + d.id).set(body); S.dirty = false; $("#sync").textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
  catch (e) { $("#sync").textContent = "Not saved"; toast(e.code === "invalid_argument" ? "You have view-only access, so changes can't be saved." : "Couldn't save. Check your connection and try again."); if (e.code === "invalid_argument") S.canWrite = false; }
  S.saving = false;
}
async function flushDraft() { if (S.dirty) await saveDraft(); }

// ---------- totals ----------
function sheetTotals(sh) {
  let hours = 0, bill = 0, billH = 0, cost = 0; const day = [0,0,0,0,0,0,0];
  (sh.rows || []).forEach(r => { const t = S.tasks[r.taskId] || {}; (r.h||[]).forEach((v, i) => { v = +v || 0; day[i] += v; hours += v; bill += v * (+t.billRate||0); cost += v * (+t.rate1099||0); if (billable(t)) billH += v; }); });
  return {hours, bill, billH, cost, day};
}

// ---------- render ----------
function render() {
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === S.view ? "page" : "false"));
  const m = $("#main");
  if (!Object.values(S.got).every(Boolean)) return;
  if (!Object.keys(S.tasks).length && !Object.keys(S.resources).length) {
    m.innerHTML = `<div class="panel empty"><h2>No tasks or resources yet</h2><p class="note" style="margin:8px auto 0">Add a resource, a project and its tasks under Setup, then come back here to log hours.</p><p><button class="btn primary" data-go="setup">Open Setup</button></p></div>`; return;
  }
  ({timesheet: vTimesheet, approvals: vApprovals, budgets: vBudgets, mileage: vMileage, contacts: vContacts, accounts: vAccounts, pipeline: vPipeline, employees: vEmployees, invoices: vInvoices, accounting: vAccounting, reports: vReports, setup: vSetup})[S.view](m);
}
function updateBadge() {
  const n = Object.values(S.sheets).filter(s => s.status === "submitted").length, b = $("#apprBadge");
  b.hidden = !n; b.textContent = n;
  const o = invList().filter(i => invStatus(i) === "overdue").length, ib = $("#invBadge"); ib.hidden = !o; ib.textContent = o;

}
const statusPill = s => `<span class="pill st-${esc(s||"draft")}">${({draft:"Draft",submitted:"Submitted",approved:"Approved",returned:"Returned"})[s||"draft"]}</span>`;

  const res = S.resources[S.resource] || {};
  let html = `

    <span class="spacer"></span>

    <div class="weeknav" role="group" aria-label="Week">
      <button id="wkPrev" aria-label="Previous week">‹</button><span class="wk">${weekLabel(S.week)}</span><button id="wkNext" aria-label="Next week">›</button>
    </div>

      <span class="spacer"></span>
      ${!lk ? `<button class="btn" id="copyPrev">Copy lines from last week</button><button class="btn primary" id="submit"${tot.hours?"":" disabled"}>Submit week</button>` : ""}
      ${d.status==="submitted" && S.canEdit ? `<button class="btn good" data-appr="${esc(d.id)}">Approve</button><button class="btn" data-ret="${esc(d.id)}">Return</button>` : ""}
      ${(d.status==="submitted" && !S.canEdit && S.canWrite) ? `<button class="btn" id="recall">Recall to draft</button>` : ""}

      <th class="n">Total</th><th>Note</th><th></th></tr></thead>
      <tbody>${d.rows.length ? d.rows.map((r, ri) => {

        return `<tr data-ri="${ri}"><td><span>${esc(t.task)}</span> ${billable(t)?`<span class="chip bill">Billable</span>`:`<span class="chip">Internal</span>`}<span class="sub">${esc(projName(t))} · ${esc(t.client||"")} · #${esc(t.taskId ?? r.taskId)}</span></td>
          ${r.h.map((v,i) => `<td class="cell${i>4?" we":""}"><input class="h${v?"":" zero"}" inputmode="decimal" aria-label="${esc(t.task)} ${DAYS[i]}" data-ri="${ri}" data-di="${i}" value="${v?fh(v):"0"}"${lk?" disabled":""}></td>`).join("")}
          <td class="n num rt">${fh2(sum(r.h))}</td>
          <td><input class="memo" data-note="${ri}" value="${esc(r.note)}" placeholder="${lk?"":"Add note"}" aria-label="Note for ${esc(t.task)}"${lk?" disabled":""}></td>
          <td>${lk?"":`<button class="btn quiet sm" data-del="${ri}" aria-label="Remove line">✕</button>`}</td></tr>`;
      }).join("") : `<tr><td colspan="11" class="empty">No lines on this timesheet yet. Add a task below or copy last week's lines.</td></tr>`}</tbody>

    </table></div>
    ${!lk ? `<div class="addline"><select id="addSel" aria-label="Task to add"><option value="">Add a task line…</option>${Object.entries(byProj).map(([p, ts]) => `<optgroup label="${esc(p)}">${ts.map(t => `<option value="${t.taskId}">${esc(t.task)} — ${esc(t.client)}</option>`).join("")}</optgroup>`).join("")}</select>
      <button class="btn" id="addBtn">Add line</button>${!avail.length?`<span class="note">Every task assigned to ${esc(res.name)} is on this sheet.</span>`:""}</div>` : ""}
    <div class="stats" id="stats">${statsHtml(tot)}</div>

function statsHtml(t) {
  const we = iso(addDays(parse(S.week), 6)), wt = Object.values(S.trips).filter(x => x.resourceId === S.resource && x.date >= S.week && x.date <= we);
  return [["Week total", fh2(t.hours) + " h"], ["Billable", fh2(t.billH) + " h"], ["Internal", fh2(t.hours - t.billH) + " h"], ["Utilization", t.hours ? pct(t.billH / t.hours) : "—"], ["Billing value", fm(t.bill)],
    ["Mileage", `${fmi(sum(wt.map(x => x.miles)))} mi <button class="btn quiet sm" data-go="mileage" style="vertical-align:middle">${wt.length} trip${wt.length===1?"":"s"} ›</button>`]]
    .map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}
function confirmBar() {
  const c = S.confirm;
  if (c.kind === "return") return `<div class="confirm"><strong>Return this timesheet?</strong><input class="field" id="retNote" placeholder="Reason (optional)" style="flex:1;min-width:180px"><button class="btn" data-cx>Cancel</button><button class="btn primary" data-doret="${esc(c.id)}">Return to resource</button></div>`;
  if (c.kind === "submit") return `<div class="confirm"><strong>Submit ${fh2(sheetTotals(S.draft).hours)} hours for ${esc(weekLabel(S.week))}?</strong><span class="note">Hours lock until an approver returns the sheet.</span><span class="spacer"></span><button class="btn" data-cx>Cancel</button><button class="btn primary" id="doSubmit">Submit</button></div>`;
  if (c.kind === "deltrip") { const t = S.trips[c.id] || {}; return `<div class="confirm"><strong>Delete the ${esc(t.date)} trip (${fmi(t.miles)} mi)?</strong><span class="note">This can't be undone.</span><span class="spacer"></span><button class="btn" data-cx>Cancel</button><button class="btn danger" data-dotdel="${esc(c.id)}">Delete trip</button></div>`; }
  if (c.kind === "delete") return `<div class="confirm"><strong>${esc(c.label)}</strong><span class="spacer"></span><button class="btn" data-cx>Cancel</button><button class="btn danger" id="doDelete">Delete</button></div>`;
  return "";
}
function refreshTotals() {
  const t = sheetTotals(S.draft);
  document.querySelectorAll("#grid tbody tr[data-ri]").forEach(tr => { tr.querySelector(".rt").textContent = fh2(sum(S.draft.rows[+tr.dataset.ri].h)); });
  document.querySelectorAll("#grid .dt").forEach((td, i) => { td.textContent = fh2(t.day[i]); td.classList.toggle("over", t.day[i] > 12); });
  $("#wkTot").textContent = fh2(t.hours); $("#stats").innerHTML = statsHtml(t);
  const sb = $("#submit"); if (sb) sb.disabled = !t.hours;
}

  m.innerHTML = `<div class="row"><div><div class="eyebrow">Review</div><h1>Approvals</h1></div><span class="spacer"></span>
    <label class="row note"><input type="checkbox" id="allAppr"${S.showAllAppr?" checked":""}> Show every timesheet</label></div>
    ${!S.canEdit ? `<p class="note">Only editors of this page can approve or return timesheets. You can still see their status here.</p>` : ""}
    <section class="panel">${S.confirm && S.confirm.kind === "return" ? confirmBar() : ""}<div class="scroll"><table>
    <thead><tr><th>Resource</th><th>Week</th><th>Status</th><th class="n">Hours</th><th class="n">Billable</th><th class="n">Billing value</th><th class="n">Cost</th><th></th></tr></thead>
    <tbody>${list.length ? list.map(s => { const t = sheetTotals(s); return `<tr><td>${esc(s.resource)}</td><td>${esc(weekLabel(s.weekStart))}</td><td>${statusPill(s.status)}</td>
      <td class="n num">${fh2(t.hours)}</td><td class="n num">${fh2(t.billH)}</td><td class="n num">${fm(t.bill)}</td><td class="n num">${fm(t.cost)}</td>

      ${s.status==="submitted" && S.canEdit ? `<button class="btn sm good" data-appr="${esc(s.id)}">Approve</button><button class="btn sm" data-ret="${esc(s.id)}">Return</button>` : ""}</div></td></tr>`; }).join("")
      : `<tr><td colspan="8" class="empty">${S.showAllAppr ? "No timesheets yet." : "Nothing waiting for approval."}</td></tr>`}</tbody></table></div></section>`;

// actuals across all timesheets
function actuals() {
  const a = {};
  Object.values(S.sheets).forEach(s => (s.rows||[]).forEach(r => { a[r.taskId] = (a[r.taskId] || 0) + sum(r.h || []); }));
  return a;
}
function vBudgets(m) {
  const act = actuals(), groups = {};
  taskList().forEach(t => (groups[t.projectId || t.project] ||= []).push(t));
  const projOrder = Object.keys(groups).sort((a,b) => { const ia = groups[a].every(t => !billable(t)), ib = groups[b].every(t => !billable(t)); return ia - ib || projName(groups[a][0]).localeCompare(projName(groups[b][0])); });
  let rows = "";
  projOrder.forEach(pid => {
    const ts = groups[pid], p = S.projects[pid] || {}, internal = ts.every(t => !billable(t));
    let B = 0, A = 0, V = 0, C = 0;
    const tr = ts.map(t => {
      const b = +t.budgetHours || 0, a = act[t.taskId] || 0, flat = (t.type || p.type) === "Flat Fee";
      const value = flat ? b * (+t.billRate||0) : a * (+t.billRate||0), cost = a * (+t.rate1099||0);
      B += b; A += a; V += value; C += cost;
      const r = b ? a / b : 0, cls = r > 1 ? "over" : r > .8 ? "hi" : "";
      return `<tr><td>${esc(t.task)}<span class="sub">#${t.taskId} · ${esc(t.client)}</span></td><td>${esc(t.resource)}</td><td><span class="chip">${esc(t.type || p.type || "")}</span></td>
        <td class="n num">${t.billRate ? fm(t.billRate) : "—"}</td><td class="n num">${b ? fh2(b) : "—"}</td><td class="n num">${fh2(a)}</td>
        <td class="n num${b && a > b ? " over" : ""}">${b ? fh2(b - a) : "—"}</td>
        <td>${b ? `<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="burn ${cls}" style="flex:1"><i style="width:${Math.min(100, r*100)}%"></i></div><span class="num" style="font-size:12px;width:38px;text-align:right">${pct(r)}</span></div>` : `<span class="note">No budget</span>`}</td>
        <td class="n num">${internal ? "—" : fm(value)}</td><td class="n num">${internal ? "—" : fm(cost)}</td><td class="n num">${internal ? "—" : fm(value - cost)}</td></tr>`;
    }).join("");
    rows += `<tr class="grp"><td colspan="4">${esc(p.name || projName(ts[0]))} <span class="sub">${esc(pid)} · ${esc(p.type || "")}${p.start ? " · started " + esc(parse(p.start).toLocaleDateString()) : ""}${p.end ? " · ends " + esc(parse(p.end).toLocaleDateString()) : ""}</span></td>
      <td class="n num">${B ? fh2(B) : "—"}</td><td class="n num">${fh2(A)}</td><td class="n num">${B ? fh2(B - A) : "—"}</td><td>${B ? pct(A/B) + " used" : ""}</td>
      <td class="n num">${internal ? "—" : fm(V)}</td><td class="n num">${internal ? "—" : fm(C)}</td><td class="n num">${internal ? "—" : fm(V - C)}</td></tr>` + tr;
  });
  m.innerHTML = `<div><div class="eyebrow">Hours against plan</div><h1>Project budgets</h1></div>
  <p class="note">Actual hours include every timesheet line, at any status. Value for T&amp;M tasks is actual hours × bill rate. For Flat Fee tasks it is the fixed contract value (budgeted hours × bill rate), so overruns show up as lower margin. Cost is actual hours × 1099 rate.</p>
  <section class="panel"><div class="scroll"><table style="min-width:1080px">
  <thead><tr><th>Task</th><th>Resource</th><th>Type</th><th class="n">Bill rate</th><th class="n">Budget h</th><th class="n">Actual h</th><th class="n">Remaining</th><th style="width:150px">Burn</th><th class="n">Value</th><th class="n">Cost</th><th class="n">Margin</th></tr></thead>
  <tbody>${rows}</tbody></table></div></section>`;
}

// ---------- reports ----------
function rangeDates(r = S.rep) {
  const now = new Date(), ws = monday(now);
  switch (r.range) {
    case "week": return [iso(ws), iso(addDays(ws, 6))];
    case "lastweek": return [iso(addDays(ws, -7)), iso(addDays(ws, -1))];
    case "month": return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(new Date(now.getFullYear(), now.getMonth()+1, 0))];
    case "lastmonth": return [iso(new Date(now.getFullYear(), now.getMonth()-1, 1)), iso(new Date(now.getFullYear(), now.getMonth(), 0))];

    }
    await S.db.doc(path).set(body); S.editing = null; toast("Saved"); render();
  } catch (e) { toast(e.message || (e.code === "invalid_argument" ? "Only editors can change setup." : "Couldn't save.")); }
}

// ---------- events ----------
function openTrip(tr) { S.tripEdit = tr.dataset.trip; S.confirm = null; render(); const f = $("#tripForm"); if (f) f.scrollIntoView({block: "start", behavior: "smooth"}); }
document.addEventListener("click", async ev => {
  const tr = ev.target.closest("tr[data-trip]"); if (tr) { openTrip(tr); return; }
  if (ev.target.closest("div[data-close]")) { closeDrawer(); return; }
  const itr = ev.target.closest("tr[data-inv]"); if (itr) { S.inv.sel = itr.dataset.inv; S.inv.draft = null; S.inv.pay = false; S.confirm = null; render(); window.scrollTo(0, 0); return; }
  const gtr = ev.target.closest("tr[data-goinv]"); if (gtr) { S.view = "invoices"; S.inv.sel = gtr.dataset.goinv; S.inv.draft = null; try { history.replaceState(null, "", "#invoices"); } catch {} render(); window.scrollTo(0, 0); return; }
  const ttr = ev.target.closest("tr[data-txid]"); if (ttr) { S.acct.txEdit = ttr.dataset.txid; S.acct.txKind = (S.ledger[ttr.dataset.txid] || {}).type || "expense"; S.confirm = null; render(); $("#txPanel").scrollIntoView({block: "start", behavior: "smooth"}); return; }
  const card = ev.target.closest(".ocard"); if (card) { openOpp(card.dataset.opp); return; }
  const b = ev.target.closest("button"); if (!b) return;
  if (b.closest("#nav")) { await flushDraft(); S.view = b.dataset.v; S.confirm = null; S.editing = null; try { history.replaceState(null, "", "#" + S.view); } catch { location.hash = S.view; } if (S.view === "timesheet") loadDraft(); render(); return; }
  if (S.view === "contacts" && conClick(b)) return;
  if (S.view === "accounts" && accClick(b)) return;
  if (pipeClick(b)) return;
  if (S.view === "invoices" && invClick(b)) return;
  if (S.view === "accounting" && acctClick(b)) return;
  if (b.dataset.goacct) { S.view = "accounts"; S.acc.sel = b.dataset.goacct; S.acc.editing = false; S.confirm = null; try { history.replaceState(null, "", "#accounts"); } catch {} render(); return; }
  if (b.dataset.go) { await flushDraft(); S.view = b.dataset.go; S.confirm = null; try { history.replaceState(null, "", "#" + S.view); } catch {} if (S.view === "mileage") { const ws = S.week, we = iso(addDays(parse(ws), 6)); if (S.view === "mileage" && b.closest("#stats")) S.mil = {...S.mil, range: "custom", from: ws, to: we}; } render(); return; }
  if (b.dataset.quick != null) { const t = frequentTrips()[+b.dataset.quick].t; const set = (k, v) => { const el = $("#tf-" + k); if (el) el.value = v ?? ""; };
    set("purpose", t.purpose); set("contact", t.contact); set("client", t.client); set("route", t.route); set("kind", t.kind); set("vehicle", t.vehicle); set("miles", t.miles);
    const st = lastOdo(t.vehicle); set("odoStart", st ?? ""); set("odoEnd", st != null ? Math.round((st + +t.miles) * 10) / 10 : ""); tfPreview(); $("#tf-date").focus(); return; }
  if (b.id === "tf-save") { saveTrip(); return; }
  if (b.id === "tf-cancel") { S.tripEdit = null; S.confirm = null; render(); return; }
  if (b.dataset.tdel) { S.confirm = {kind: "deltrip", id: b.dataset.tdel}; render(); return; }
  if (b.dataset.dotdel) { try { await S.db.doc("trips/" + b.dataset.dotdel).delete(); S.tripEdit = null; S.confirm = null; toast("Trip deleted"); render(); } catch { toast("Couldn't delete the trip."); } return; }
  if (b.id === "milCsv") { exportMileage(); return; }
  const id = b.id;
  if (id === "wkPrev" || id === "wkNext" || id === "wkToday") { await flushDraft(); S.week = id === "wkToday" ? iso(monday(new Date())) : iso(addDays(parse(S.week), id === "wkPrev" ? -7 : 7)); S.confirm = null; loadDraft(); render(); return; }
  if (id === "addBtn") { const v = $("#addSel").value; if (!v) { toast("Pick a task to add."); return; } S.draft.rows.push({taskId: Number(v), h: [0,0,0,0,0,0,0], note: ""}); render(); queueSave(true); return; }
  if (b.dataset.del != null) { S.draft.rows.splice(+b.dataset.del, 1); render(); queueSave(true); return; }
  if (id === "copyPrev") {
    const mine = Object.values(S.sheets).filter(s => s.resourceId === S.resource && s.weekStart < S.week).sort((a,b) => b.weekStart.localeCompare(a.weekStart));
    const prev = mine[0]; if (!prev) { toast("No earlier timesheet to copy from."); return; }
    const have = new Set(S.draft.rows.map(r => String(r.taskId))); let n = 0;
    prev.rows.forEach(r => { if (!have.has(String(r.taskId))) { S.draft.rows.push({taskId: r.taskId, h: [0,0,0,0,0,0,0], note: ""}); n++; } });
    render(); if (n) { queueSave(true); toast(`Added ${n} line${n>1?"s":""} from ${weekLabel(prev.weekStart)}`); } else toast("Those lines are already here."); return;
  }
  if (id === "submit") { S.confirm = {kind: "submit"}; render(); return; }
  if (id === "doSubmit") { S.confirm = null; S.draft.status = "submitted"; S.draft.submittedAt = new Date().toISOString(); render(); await saveDraft(); toast("Timesheet submitted"); render(); return; }
  if (id === "recall" || id === "reopen") { S.draft.status = "draft"; render(); await saveDraft(); toast(id === "recall" ? "Back to draft" : "Reopened for edits"); render(); return; }
  if (b.dataset.cx != null) { S.confirm = null; render(); return; }
  if (b.dataset.appr) { await setStatus(b.dataset.appr, {status: "approved", approvedAt: new Date().toISOString(), approvedBy: S.uid || null}); toast("Approved"); return; }
  if (b.dataset.ret) { S.confirm = {kind: "return", id: b.dataset.ret}; render(); return; }
  if (b.dataset.doret) { const note = ($("#retNote") || {}).value || ""; S.confirm = null; await setStatus(b.dataset.doret, {status: "returned", returnNote: note}); toast("Returned to resource"); return; }
  if (b.dataset.open) { const s = S.sheets[b.dataset.open]; S.resource = s.resourceId; S.week = s.weekStart; S.view = "timesheet"; try { history.replaceState(null, "", "#timesheet"); } catch {} loadDraft(); render(); return; }
  if (id === "csv") { exportCsv(); return; }
  if (b.dataset.edit) { S.editing = {kind: b.dataset.edit, id: b.dataset.id}; render(); return; }
  if (b.dataset.new) {
    const k = b.dataset.new, seed = k === "tasks" ? {taskId: Math.max(500, ...taskList().map(t => +t.taskId || 0)) + 1, type: "T&M", billRate: 0, rate1099: 0, budgetHours: 0, active: true, resource: (resList()[0]||{}).name, projectId: (Object.values(S.projects)[0]||{}).id} : k === "projects" ? {type: "T&M", start: iso(new Date())} : k === "employees" ? {active: true} : k === "vehicles" ? {active: true} : k === "rates" ? {id: iso(new Date()), business: 0, charitable: 0.14} : {};
    S.editing = {kind: k, id: "__new", seed}; render(); return;
  }
  if (b.dataset.cxEdit != null) { S.editing = null; render(); return; }
  if (b.dataset.save) { saveSetup(b.dataset.save); return; }
});
async function setStatus(id, patch) {
  if (S.draft && S.draft.id === id) { Object.assign(S.draft, patch); render(); await saveDraft(); render(); return; }
  try { await S.db.doc("timesheets/" + id).update({...patch, updatedAt: new Date().toISOString()}); }
  catch (e) { toast(e.code === "invalid_argument" ? "You don't have permission to change this timesheet." : "Couldn't update. Try again."); }
}
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.matches("input.h")) {
    const v = parseHours(el.value), r = S.draft.rows[+el.dataset.ri];
    el.classList.toggle("bad", isNaN(v) || v > 24); if (isNaN(v) || v > 24) return;
    r.h[+el.dataset.di] = v; el.classList.toggle("zero", !v); refreshTotals(); queueSave();
  } else if (el.matches("input.memo")) { S.draft.rows[+el.dataset.note].note = el.value; queueSave(); }
  else if (el.id === "tf-odoStart" || el.id === "tf-odoEnd") {
    const s = tfNum("tf-odoStart"), e = tfNum("tf-odoEnd");
    if (s != null && e != null && e >= s) $("#tf-miles").value = Math.round((e - s) * 10) / 10;
    tfPreview();
  } else if (el.id === "tf-miles" || el.id === "tf-date") tfPreview();
  else if (el.id === "conQ") { S.con.q = el.value; refreshList(); }
  else if (el.id === "accQ") { S.acc.q = el.value; refreshAcc(); }
  else if (el.dataset.ldesc != null || el.dataset.lqty != null || el.dataset.lrate != null) {
    const i = S.inv.draft, n = +(el.dataset.ldesc ?? el.dataset.lqty ?? el.dataset.lrate), l = i.lines[n];
    if (el.dataset.ldesc != null) l.description = el.value;
    else { const v = Number(String(el.value).replace(/[$,]/g, "")); if (!isFinite(v)) return; if (el.dataset.lqty != null) l.qty = v; else l.rate = v; l.amount = r2(l.qty * l.rate);
      const c = document.querySelector(`[data-lamt="${n}"]`); if (c) c.textContent = fm2(l.amount); ivTotals(); }
  }
  else if (el.id === "pipeQ") { S.pipe.q = el.value; $("#board").outerHTML = boardHtml(); }
});
document.addEventListener("focusin", ev => { if (ev.target.matches("input.h")) ev.target.select(); });
document.addEventListener("focusout", ev => {
  const el = ev.target; if (!el.matches("input.h") || !S.draft) return;
  const v = S.draft.rows[+el.dataset.ri]?.h[+el.dataset.di] || 0; el.value = v ? fh(v) : "0"; el.classList.remove("bad"); el.classList.toggle("zero", !v);
});
document.addEventListener("keydown", ev => {
  const el = ev.target;
  if (el.matches("tr[data-trip]") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openTrip(el); return; }
  if (el.id === "lgText" && ev.key === "Enter") { ev.preventDefault(); $("#lgAdd").click(); return; }
  if (el.id === "alText" && ev.key === "Enter") { ev.preventDefault(); $("#alAdd").click(); return; }
  if (el.id === "onText" && ev.key === "Enter") { ev.preventDefault(); $("#onAdd").click(); return; }
  if (ev.key === "Escape" && $("#drawer")) { closeDrawer(); return; }
  if (el.matches(".ocard") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openOpp(el.dataset.opp); return; }
  if (!el.matches("input.h")) return;
  const ri = +el.dataset.ri, di = +el.dataset.di, mv = {ArrowUp: [-1,0], ArrowDown: [1,0], Enter: [1,0]}[ev.key]; if (!mv) return;
  const nx = document.querySelector(`input.h[data-ri="${ri+mv[0]}"][data-di="${di+mv[1]}"]`); if (nx) { ev.preventDefault(); nx.focus(); }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "resSel") { await flushDraft(); S.resource = el.value; store.set("bt.resource", el.value); S.confirm = null; loadDraft(); render(); }
  else if (el.id === "allAppr") { S.showAllAppr = el.checked; render(); }
  else if (el.id === "repRange") { S.rep.range = el.value; render(); }
  else if (el.id === "repGroup") { S.rep.group = el.value; render(); }
  else if (el.id === "repFrom" || el.id === "repTo") { S.rep[el.id === "repFrom" ? "from" : "to"] = el.value; render(); }
  else if (el.id === "addSel" && el.value) { $("#addBtn").click(); }
  else if (el.id === "milRange") { S.mil.range = el.value; render(); }
  else if (el.id === "milVeh") { S.mil.vehicle = el.value; render(); }
  else if (el.id === "milKind") { S.mil.kind = el.value; render(); }
  else if (el.id === "milFrom" || el.id === "milTo") { S.mil[el.id === "milFrom" ? "from" : "to"] = el.value; render(); }
  else if (el.id === "tf-vehicle" && !S.tripEdit) { const st = lastOdo(el.value); $("#tf-odoStart").value = st ?? ""; $("#tf-odoEnd").value = ""; }
  else if (el.id === "tf-kind") tfPreview();
  else if (el.id === "conShow" || el.id === "conSource" || el.id === "conSort") { S.con[{conShow: "show", conSource: "source", conSort: "sort"}[el.id]] = el.value; refreshList(); }
  else if (el.id === "invStatusF" || el.id === "invAcctF") { S.inv[el.id === "invStatusF" ? "status" : "acct"] = el.value; render(); }
  else if (el.id && el.id.startsWith("g-")) { const g = S.inv.gen, k = el.id.slice(2);
    if (k === "account") g.accountId = el.value; else if (k === "cadence") { g.cadence = el.value; g.catchup = false; if (el.value === "adhoc") { g.from = g.from || periodOf(today())[0]; g.to = g.to || today(); } }
    else if (k === "period") { if (el.value) { g.period = el.value; g.catchup = false; } } else if (k === "from" || k === "to") g[k] = el.value;
    else if (k === "unappr") g.unapproved = el.checked; else if (k === "flat") g.flat = el.checked; render(); }
  else if (el.id === "iv-issue" || el.id === "iv-terms" || el.id === "iv-tax") { readInvInputs(); render(); }
  else if (el.dataset.ltax != null) { readInvInputs(); S.inv.draft.lines[+el.dataset.ltax].taxable = el.checked; render(); }
  else if (el.id === "acRange" || el.id === "acBasis") { S.acct[el.id === "acRange" ? "range" : "basis"] = el.value; render(); }
  else if (el.id === "acFrom" || el.id === "acTo") { S.acct[el.id === "acFrom" ? "from" : "to"] = el.value; render(); }
  else if (el.id === "pipeRep") { S.pipe.rep = el.value; $("#board").outerHTML = boardHtml(); $("#pipeStats").innerHTML = pipeStatsHtml(); }
  else if (el.id === "of-account") { refreshOppContacts(); }
  else if (el.id === "of-addContact" && el.value) { const ids = new Set(oppDraftContacts()); ids.add(el.value); S.pipe.contacts = [...ids]; refreshOppContacts(); }
  else if (el.id === "accType" || el.id === "accSort") { S.acc[el.id === "accType" ? "type" : "sort"] = el.value; refreshAcc(); }
  else if (el.id === "afuDate") patchAccount({followUp: el.value}, el.value ? "Follow-up set for " + parse(el.value).toLocaleDateString() : "Follow-up cleared");
  else if (el.id === "fuDate") patchContact({followUp: el.value}, el.value ? "Follow-up set for " + parse(el.value).toLocaleDateString() : "Follow-up cleared");
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) { S.view = h; render(); } });
window.addEventListener("beforeunload", () => { if (S.dirty) saveDraft(); });

document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === S.view ? "page" : "false"));
{ const st = document.createElement("style"); st.textContent = IV_CSS; document.head.appendChild(st); }
boot();
})();
</script>
